<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fff" />
    <meta name="description" content="GeoStates is a game about guessing the names of provinces" />
    <link rel="icon" href="../../assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/theme.css">
    <link rel="stylesheet" href="../game.css">
    <title>GeoStates</title>
</head>
<body>
    <main>
        <header>
            <img src="../../assets/logo.svg" alt="Geostates logo" width="326" height="77">
            <h1>Name the provinces of Argentina</h1>
        </header>

        <section id="map" aria-label="Argentina's map">
            <p class="map-loading">Loading map...</p>
        </section>

        <section id="inputs">
            <div class="input-group">
                <input type="text" id="answerInput" aria-label="Enter the name of the province" placeholder="Type a province name…" autocomplete="off" />
                <button id="btn" class="btn" type="button">Guess</button>
            </div>
            <div class="stats">
                <p>Completed: <span id="completed">0</span> / <span id="total">0</span></p>
                <p>Mistakes: <span id="mistakes">0</span></p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; GeoStates 2024 | <a href="https://github.com/igor-couto/guess-the-state" target="_blank" rel="noreferrer">GitHub</a></p>
    </footer>
    <script defer src="../game.js"></script>
    <script defer src="./script.js"></script>
</body>
</html>
